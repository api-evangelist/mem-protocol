name: Mem Protocol
description: >-
  Mem Protocol (mem.so) was a San Francisco based startup, founded in 2021,
  building tools for the social layer of web3 - a decentralized social-media
  protocol focused on user data sovereignty, portable social graphs, and
  verifiable on-chain identity. The company raised a ~$3.1M seed round in 2021
  led by Andreessen Horowitz (a16z crypto), with participation from Balaji
  Srinivasan and Polychain's Olaf Carlson-Wee. As of this enrichment pass the
  project appears dormant/defunct - the official domain mem.so resolves only to
  a parking IP and times out, and the alternate domain memprotocol.xyz redirects
  to a GoDaddy for-sale page. No live website, developer portal, API
  documentation, GitHub organization, SDK packages, or public API surface could
  be found. This profile remains an identity-only company record; there is
  nothing to enrich beyond the historical facts below.
